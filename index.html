<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Q2 Drill 1 Calma</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		body{
			justify-content: center;
			display: flex;
			align-content: center;
			background-image:url(BG.jpg);
			background-repeat: no-repeat;
			background-size: cover;
			background-position: center;

		}
	.demo{
			padding: 15px;
			margin-bottom: 15px;
			border: 2px solid;
			border-radius: 30px;
			width: 1300px;
			height: 90px;
			align-self: center;
			margin-left: auto;
    margin-right: auto;


		}

		.container-demo{
			background: whitesmoke;
			border-color: black;
			justify-content: center;

		}
		.fluid-demo{
			background: whitesmoke;
			border-color: black;
		}

		.md-demo{
			background: whitesmoke;
			border-color: black;
		}

		.lg-demo{
			background: whitesmoke;
			border-color: black;
		}

		.xl-demo{
			background: whitesmoke;
			border-color: black;
		}

		.xxl-demo{
			background: whitesmoke;
			border-color: black;
		}
		img{
			width: 150px;
			height: 150px;
			border: 10px;
			border-radius: 20px;
			align-content: center;
		}

		h3{
			font-size: 25px;
		}

		p{
			font-size: 15px;
		}
		h4{
			font-size: 32px;
		}


	</style>

</head>
<body>

	<div class="container-fluid">
		<div class="demo fluid-demo">
			<h4 class="text-center">Begginer's guide to Pickleball</h4>
			
		</div>

	<center><img src="PICKLEBALL.png"></center>

	<div class="container-md">
		<div class="demo md-demo">
			<h3>Basic Rules</h3>
			<p>Serve diagonally, Double bounce rule, No volley zone, Scoring</p>
		</div>
	</div>

	<div class="container-lg">
		<div class="demo lg-demo">
			<h3>Equipment</h3>
			<p>Paddle, Ball, Net, Court</p>
		</div>
	</div>

	<div class="container-xl">
		<div class="demo xl-demo">
			<h3>Basic Techniques</h3>
			<p>Forehand/Backhand Strokes, Serving tactics, Dinking, Positioning</p>
		</div>
	</div>

	<div class="container-xxl">
		<div class="demo xxl-demo">
			<h3>Player modes</h3>
			<p>Singles, Doubles</p>
		</div>
	</div>



</body>
</html>
